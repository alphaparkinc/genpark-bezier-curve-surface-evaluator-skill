[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-bezier-curve-surface-evaluator-skill"
version = "1.0.0"
description = "Parametric polynomial curves and surfaces with de Casteljau's algorithm and bicubic Bézier patch evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Rendering"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-bezier-curve-surface-evaluator-skill"
Repository = "https://github.com/alphaparkinc/genpark-bezier-curve-surface-evaluator-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-bezier-curve-surface-evaluator-skill/issues"
